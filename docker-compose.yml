version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./juris_shorts.db
      - ADMIN_API_KEY=juris_admin_secret_key_2026

  consumer-app:
    build:
      context: ./consumer-app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

  admin-app:
    build:
      context: ./admin-app
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_ADMIN_KEY=juris_admin_secret_key_2026
    depends_on:
      - backend

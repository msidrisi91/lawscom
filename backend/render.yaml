services:
  - type: web
    name: jurisshorts-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt --prefer-binary"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.7
      - key: DATABASE_URL
        value: "sqlite:///./juris_shorts.db"
      - key: ADMIN_API_KEY
        generateValue: true
